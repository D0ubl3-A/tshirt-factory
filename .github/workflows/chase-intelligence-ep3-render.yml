name: Chase Intelligence Episode 3 Render
on:
  push:
    paths:
      - ".github/workflows/chase-intelligence-ep3-render.yml"
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Download source and narration
        run: |
          curl -L --fail --retry 5 --retry-delay 2 "https://northarknow-api-t3ngwy6mea-ue.a.run.app/media/articles/2366.mp4?download=true" -o source.mp4
          curl -L --fail --retry 5 --retry-delay 2 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ece6c9e2-f5e3-4f8d-8bf9-e3fc6cb5e900.mp3" -o narration.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 source.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 narration.mp3
      - name: Render branded episode
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 narration.mp3)
          ENDSTART=$(python3 -c "d=float('$DUR'); print(max(0,d-6.5))")
          ffmpeg -y -stream_loop -1 -i source.mp4 -i narration.mp3 \
            -filter_complex "[0:a]volume=0.14[a0];[1:a]volume=1.0[a1];[a0][a1]amix=inputs=2:duration=second:dropout_transition=2[a]" \
            -vf "drawbox=x=0:y=0:w=iw:h=170:color=black@0.58:t=fill:enable='between(t,0,4)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CHASE INTELLIGENCE':fontcolor=white:fontsize=58:x=(w-text_w)/2:y=26:enable='between(t,0,4)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='REAL PURSUITS. FULL INTELLIGENCE.':fontcolor=white:fontsize=25:x=(w-text_w)/2:y=94:enable='between(t,0,4)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='CHANNEL POWERED BY iLLCo-AI':fontcolor=white:fontsize=18:x=(w-text_w)/2:y=130:enable='between(t,0,4)',drawbox=x=18:y=18:w=410:h=103:color=black@0.46:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CHASE INTELLIGENCE':fontcolor=white:fontsize=26:x=32:y=30,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Real Pursuits. Full Intelligence.':fontcolor=white:fontsize=15:x=32:y=62,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='CHANNEL POWERED BY iLLCo-AI':fontcolor=white:fontsize=13:x=32:y=87,drawbox=x=0:y=0:w=iw:h=ih:color=black@0.74:t=fill:enable='between(t,$ENDSTART,$DUR)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='CHASE INTELLIGENCE':fontcolor=white:fontsize=64:x=(w-text_w)/2:y=(h-text_h)/2-78:enable='between(t,$ENDSTART,$DUR)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='REAL PURSUITS. FULL INTELLIGENCE.':fontcolor=white:fontsize=28:x=(w-text_w)/2:y=(h-text_h)/2+2:enable='between(t,$ENDSTART,$DUR)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='CHANNEL POWERED BY iLLCo-AI':fontcolor=white:fontsize=20:x=(w-text_w)/2:y=(h-text_h)/2+48:enable='between(t,$ENDSTART,$DUR)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SUBSCRIBE':fontcolor=white:fontsize=30:x=(w-text_w)/2:y=(h-text_h)/2+92:enable='between(t,$ENDSTART,$DUR)'" \
            -map 0:v:0 -map "[a]" -shortest \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart \
            Chase_Intelligence_Episode3_130MPH_Arkansas_BRANDED_FINAL.mp4
      - name: Verify output
        run: |
          ffprobe -v error -show_entries stream=width,height,codec_name -show_entries format=duration,size -of default=noprint_wrappers=1 Chase_Intelligence_Episode3_130MPH_Arkansas_BRANDED_FINAL.mp4
      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: Chase_Intelligence_Episode3_130MPH_Arkansas_BRANDED_FINAL
          path: Chase_Intelligence_Episode3_130MPH_Arkansas_BRANDED_FINAL.mp4
          retention-days: 1
